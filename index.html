<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f37"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg"><link rel="apple-touch-icon" href="./icons/icon-192.png"><script>try{document.documentElement.dataset.theme=localStorage.getItem("month-step-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{}</script><link rel="stylesheet" href="./style.css"><title>خطوة الشهر</title></head><body>
<header><a class="brand" href="./">◈ <span>خطوة الشهر<small>فلوسك واضحة. خطوتك محسوبة.</small></span></a><button id="theme" type="button" aria-label="تفعيل الوضع الداكن" aria-pressed="false">الوضع الداكن ☾</button><button id="install" hidden>تثبيت التطبيق</button><span class="local">● محفوظ على جهازك</span></header>
<main><div class="heading"><div><p class="eyebrow">مساحة مالية أهدى</p><h1>شهر جديد، خطوة واضحة.</h1></div><div><select id="month" aria-label="الشهر"></select><button id="newMonth">شهر جديد +</button></div></div>
<nav aria-label="أقسام التطبيق"><button data-tab="home" class="active">نظرة الشهر</button><button data-tab="budget">الميزانية</button><button data-tab="cards">البطاقات</button><button data-tab="history">الحركات</button><button data-tab="settings">الإعدادات والنسخ</button></nav>
<section id="home" class="panel"></section><section id="budget" class="panel" hidden></section><section id="cards" class="panel" hidden></section><section id="history" class="panel" hidden></section><section id="settings" class="panel" hidden></section>
<footer>بياناتك محفوظة محليًا على هذا المتصفح. نزّل نسخة احتياطية دوريًا، خصوصًا قبل حذف بيانات المتصفح.</footer></main>
<dialog id="modal"><form id="entry"><div class="dialogTop"><h2 id="dialogTitle"></h2><button type="button" id="close" aria-label="إغلاق">×</button></div><div id="fields"></div><p id="error" role="alert"></p><button class="primary" type="submit">تأكيد التسجيل</button></form></dialog><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
